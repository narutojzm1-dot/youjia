<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>可逆布置 · 隔离对照</title>
<style>body{margin:0;background:#f5eee0;color:#463d32;font:16px system-ui}main{max-width:1100px;margin:auto;padding:16px}h1{font-size:22px}button{padding:12px;margin:4px;border:1px solid #978568;border-radius:8px;background:#fffcf4;color:inherit;min-height:44px}button:disabled{opacity:.5}#yard{position:relative;aspect-ratio:16/9;background:url('../../assets/holiday/environment/yard_sunny.png') center/100% 100%;touch-action:manipulation;border:2px solid #978568}#yard button{position:absolute;padding:0;width:36px;height:36px;min-height:36px;transform:translate(-50%,-50%);background:#fff9;border:2px dashed #74583b}#placed,#ghost{position:absolute;width:2.5%;height:4.444%;transform:translate(-50%,-100%);background:#d89638;border:2px solid #513e24;pointer-events:none}#ghost{opacity:.65;border-style:dashed}.note{font-size:14px}#pair{display:flex;gap:12px;flex-wrap:wrap}#pair canvas{width:min(100%,480px);height:auto}#status{min-height:28px}#yard:focus{outline:3px solid #957345}@media(max-width:500px){main{padding:8px}h1{font-size:19px}}</style>
<main><h1>同一占位物 · 可逆布置对照</h1><p class="note">隔离研究，几何夹具；背景为已有晴天院子。位置只是构图实验，未校验地面、动物遮挡或正式透视。刷新即清空，不是正式游戏。</p>
<div><button id="spots">候选位置</button><button id="free">自由放置</button><label><input id="low" type="checkbox" checked>低动效（两种模式均静态）</label></div>
<p id="instruction">点击三个候选位置之一预览，也可用 Tab 选择。</p><div id="yard" tabindex="0" aria-label="院景布置预览"><div id="placed" hidden></div><div id="ghost" hidden></div></div>
<p id="status" role="status" aria-live="polite"></p><div><button id="confirm">确认</button><button id="cancel">取消预览</button><button id="remove">收起</button><button id="compare">合成前后预览</button></div><p class="note">自由模式：点击院景；键盘方向键移动预览，Enter 确认，Escape 取消。虚线是待确认预览，实线是本次摆放；没有库存消耗。</p><div id="pair"></div></main>
<script type="module" src="app.mjs"></script></html>
