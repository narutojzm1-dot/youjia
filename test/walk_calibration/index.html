<!doctype html><meta charset="utf-8"><title>院子脚点标定 — 候选未批准</title>
<style>body{background:#192522;color:#eee;font:16px sans-serif;margin:18px}canvas{width:100%;max-width:1280px;display:block}select,button{font:inherit;margin:8px}pre{white-space:pre-wrap}</style>
<h1>院子脚点标定 · 非游戏运行时 / 候选未批准</h1>
<label>候选<select id="pick"><option>current</option><option>door_lower</option><option>left_bank</option><option>fence_front</option></select></label><label>底图<select id="weather"><option>sunny</option><option>overcast</option></select></label><button id="toggle">显示/隐藏标线</button>
<p>白：原 lawn；青：候选边界；绿：保守脚点采样；红：水体/出生动物占位；黄：网格路线。移动鼠标显示世界脚点及最大身体足迹。身体足迹不是角色全身轮廓。</p>
<canvas id="map" width="1280" height="720"></canvas><pre id="details"></pre>
<script>
(async()=>{const d=await(await fetch('data.json')).json(),c=document.querySelector('canvas'),g=c.getContext('2d');let marks=true,point=null;const imgs={};for(const w of ['sunny','overcast']){const i=new Image();i.src='../../assets/holiday/environment/yard_'+w+'.png';await i.decode();imgs[w]=i;}const poly=(p,color)=>{g.beginPath();p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.strokeStyle=color;g.lineWidth=2;g.stroke();};
function draw(){g.drawImage(imgs[weather.value],0,0,1280,720);const v=d.candidates[pick.value];if(marks){g.fillStyle='#00ff9966';for(const [x,y] of v.safe_points)g.fillRect(x-1,y-1,2,2);poly(d.candidates.current.polygon,'white');poly(v.polygon,'cyan');g.strokeStyle='#f33';g.beginPath();g.ellipse(...d.pond,0,0,Math.PI*2);g.stroke();for(const [x,y,rx,ry] of d.sunny_spawn_obstacles){const z=.82+.36*Math.max(0,Math.min(1,(y-420)/230));g.beginPath();g.ellipse(x,y,rx*z+11.8+2,ry*z+7.08+2,0,0,Math.PI*2);g.stroke();}g.beginPath();v.route.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.strokeStyle='yellow';g.stroke();}if(point){g.beginPath();g.ellipse(...point,11.8,7.08,0,0,Math.PI*2);g.strokeStyle='magenta';g.stroke();}const {safe_points,polygon,route,...metrics}=v;details.textContent=JSON.stringify({candidate:pick.value,world_foot:point,background_render_rect:d.render_rect,metrics},null,2);window.calibrationReady=true;}
c.onmousemove=e=>{const r=c.getBoundingClientRect();point=[Math.round((e.clientX-r.left)*1280/r.width),Math.round((e.clientY-r.top)*720/r.height)];draw();};pick.onchange=weather.onchange=draw;toggle.onclick=()=>{marks=!marks;draw();};draw();})();
</script>
