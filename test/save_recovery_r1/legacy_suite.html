<!doctype html><meta charset="utf-8"><title>Legacy v5 preservation</title>
<script type="module">
import {prepareLegacyV5,importLegacyV5} from './legacy_v5.mjs';
import {decodeSourceSnapshot} from './source_decode.mjs';
import {openStore,newId} from './store.mjs';
let checks=0; const names=[];
const ok=(v,s)=>{if(!v)throw Error(s);checks++;};
async function fails(fn,label){let rejected=false;try{await fn();}catch(e){rejected=true;}ok(rejected,label);}
const unique=()=>{const n='youjia-recovery-test-'+newId();names.push(n);return n;};
const raw=' {\n "version":5,"album":["old-photo"],"photo_moments":{"old-photo":{"unknown":"原照"}},"animal_relationship_memory":{"future":{"x":1}},"plant_state":3,"unknown_id":90071992547409931234 }\n';
const pair=()=>({primary:{status:'present',text:raw},backup:{status:'absent'}});
const snapshot=async n=>{const s=await openStore(n);try{return await s.snapshot();}finally{s.close();}};
async function rawPut(n,key,value){const db=await new Promise((resolve,reject)=>{const r=indexedDB.open(n,1);r.onupgradeneeded=()=>r.result.createObjectStore('records');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});try{await new Promise((resolve,reject)=>{const t=db.transaction('records','readwrite');t.objectStore('records').put(value,key);t.oncomplete=resolve;t.onabort=()=>reject(t.error);});}finally{db.close();}}
try{
 const native=await (await fetch('./source-snapshot-fixture.json')).json();
 const decoded=decodeSourceSnapshot(native);
 ok(decoded.primary.text.includes('9007199254740993'),'native byte source preserves large integer literal');
 ok(decoded.primary.text.includes('秋日'),'native UTF8 source decoded');
 const nativeStored=await importLegacyV5(unique(),decoded);
 ok(JSON.parse(nativeStored.current.payload_bytes).sources.primary.text===decoded.primary.text,'native file -> bridge -> IDB exact raw readback');
 ok(decoded.backup.status==='absent','native missing backup explicit');
 for(const bad of [{status:'read_error',reason:'open_failed'},{status:'present',base64:'/w=='},{status:'present',base64:'YQ'},{status:'present',base64:'YQ== '},{status:'present',base64:'YQ==',extra:true}]){
  await fails(()=>decodeSourceSnapshot({primary:bad,backup:{status:'absent'}}),'unreadable or malformed native bytes reject');
 }
 ok(decodeSourceSnapshot({primary:{status:'present',base64:''},backup:{status:'absent'}}).primary.text==='','empty source remains present');
 ok(decodeSourceSnapshot({primary:{status:'present',base64:'77u/e30='},backup:{status:'absent'}}).primary.text.charCodeAt(0)===0xfeff,'BOM not silently stripped');
 const n=unique(), input=pair(), before=JSON.stringify(input), imported=await importLegacyV5(n,input);
 ok(JSON.stringify(input)===before,'source input unchanged');
 let p=JSON.parse(imported.current.payload_bytes);ok(p.sources.primary.text===raw,'exact raw text retained');
 ok(p.selected==='primary','primary chosen');ok(p.sources.backup.status==='absent','explicit absent backup');
 const stored=await snapshot(n);ok(stored.current.payload_bytes===imported.current.payload_bytes,'readback exact payload');
 await fails(()=>importLegacyV5(n,pair()),'repeat import refuses overwrite');ok(JSON.stringify(await snapshot(n))===JSON.stringify(stored),'existing record preserved');
 const fallback=pair();fallback.primary.text='{broken';fallback.backup={status:'present',text:raw};
 p=JSON.parse((await importLegacyV5(unique(),fallback)).current.payload_bytes);
 ok(p.selected==='backup','valid backup selected');ok(p.sources.primary.text==='{broken','damaged primary preserved');ok(p.sources.backup.text===raw,'backup exact original retained');
 for(const value of [null,{}, {primary:{status:'read_error'},backup:{status:'present',text:raw}}, {primary:{status:'absent'},backup:{status:'absent'}},
 {primary:{status:'present',text:'{"version":6}'},backup:{status:'present',text:raw}},
 {primary:{status:'present',text:raw},backup:{status:'present',text:'{"version":4}'}},
 {primary:{status:'present',text:'{}'},backup:{status:'absent'}},
 {primary:{status:'present',text:'[]'},backup:{status:'absent'}}]){
  const target=unique();await fails(()=>importLegacyV5(target,value),'invalid import rejected');
  ok(!(await indexedDB.databases()).some(d=>d.name===target),'invalid import does not create target');
 }
 await fails(()=>prepareLegacyV5({primary:{status:'present',text:raw+' '.repeat(65536)},backup:{status:'absent'}}),'over budget rejected');
 await fails(()=>importLegacyV5('production-save',pair()),'test namespace only');
 for(const key of ['current','intent','archive'])for(const value of [false,null,undefined]){
  const target=unique();await rawPut(target,key,value);await fails(()=>importLegacyV5(target,pair()),'present corrupt key blocks migration');
  const after=await snapshot(target);ok(after.present[key]&&Object.is(after[key],value),'corrupt target exact value retained');
 }
 // Abort the real initialization transaction after the put. No successful root
 // can survive; source is unchanged, and a later explicit retry can succeed.
 const target=unique(), original=IDBObjectStore.prototype.put;
 IDBObjectStore.prototype.put=function(...args){const result=original.apply(this,args);if(this.transaction.db.name===target)this.transaction.abort();return result;};
 try{await fails(()=>importLegacyV5(target,input),'real migration transaction abort');}finally{IDBObjectStore.prototype.put=original;}
 ok(Object.values((await snapshot(target)).present).every(v=>!v),'aborted migration leaves target empty');
 ok(JSON.stringify(input)===before,'abort leaves source unchanged');
 ok(JSON.parse((await importLegacyV5(target,input)).current.payload_bytes).sources.primary.text===raw,'retry retains exact raw');
 const frozen=pair(), frozenTarget=unique(), pending=importLegacyV5(frozenTarget,frozen);
 frozen.primary.text='{"version":6}';
 ok(JSON.parse((await pending).current.payload_bytes).sources.primary.text===raw,'caller mutation cannot change frozen source');
 const racing=unique(), alternate=pair();alternate.primary.text='{"version":5,"album":[]}';
 const results=await Promise.allSettled([importLegacyV5(racing,pair()),importLegacyV5(racing,alternate)]);
 ok(results.filter(r=>r.status==='fulfilled').length===1,'one concurrent import wins');
 ok(results.filter(r=>r.status==='rejected').length===1,'other concurrent import refused');
 const winner=results.find(r=>r.status==='fulfilled').value.current;
 ok((await snapshot(racing)).current.payload_bytes===winner.payload_bytes,'concurrent winner retained exactly');
 window.r1={status:'PASS',checks,scope:'isolated raw v5 preservation/import only; no production migration or semantic conversion'};
}catch(e){window.r1={status:'FAIL',checks,error:String(e),stack:e.stack};}
finally{for(const n of names)await new Promise((resolve,reject)=>{const r=indexedDB.deleteDatabase(n);r.onsuccess=resolve;r.onerror=()=>reject(r.error);});window.r1Done=true;document.body.textContent=JSON.stringify(window.r1);}
</script>
