    #loading h1 { font-weight: 700; font-size: clamp(24px, 4vw, 42px); line-height: 1.12; text-shadow: 0 1px 8px #fff6e8; }
    #loading-status { font-weight: 500; line-height: 1.5; }
    #loading-detail, #loading-notice { overflow-wrap: anywhere; line-height: 1.5; }
    #loading progress { display: block; width: min(320px, 75vw); height: 7px; border: 0; border-radius: 20px; overflow: hidden; accent-color: #c88755; background: #dfc9ad; }
    #loading progress::-webkit-progress-bar { background: #dfc9ad; border-radius: 20px; }
    #loading progress::-webkit-progress-value { background: #c88755; border-radius: 20px; }
    #loading progress::-moz-progress-bar { background: #c88755; border-radius: 20px; }
    #loading button { min-height: 44px; border: 1px solid #c88755; border-radius: 10px; background: #fff9f0; color: #5b4637; }
    #loading button:focus-visible { outline: 3px solid #c88755; outline-offset: 4px; }
    #loading [hidden] { display: none; }
    @media (max-aspect-ratio: 1/1) { #loading::before { background-size: 100% auto; } #loading::after { background: linear-gradient(180deg, transparent 15%, #fff6e8 100%) center top / 100% calc(100vw * 2 / 3) no-repeat; } #loading { place-content: center; padding-top: calc(100vw * 2 / 3); padding-bottom: max(24px, env(safe-area-inset-bottom)); } }
    @media (max-height: 480px) and (min-aspect-ratio: 1/1) { #loading { place-content: center end; padding: 16px 24px; } #loading > * { max-width: 44vw; } #loading h1 { font-size: clamp(20px, 4vw, 30px); } #loading::before { background-size: auto 100%; background-position: left center; } #loading::after { background: linear-gradient(90deg, #fff6e800 0%, #fff6e8dd 40%, #fff6e8 65%); } #loading progress { width: min(260px, 40vw); } }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0">Your browser does not support canvas.</canvas>
  <section id="loading" role="status">
    <h1 id="game-title"></h1>
    <p id="loading-status">Loading…</p>
    <p id="loading-detail"></p>
    <progress id="loading-progress" aria-label="Download progress"></progress>
    <p id="loading-notice" hidden></p>
    <button id="loading-retry" type="button" hidden>Retry</button>
    <p id="loading-build" style="opacity:0.8;font-size:12px;margin-top:8px;font-family:monospace;letter-spacing:0.03em"></p>
    <noscript>JavaScript is required to play this game.</noscript>
  </section>
  <script>
    (() => {
      const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"game-be4ff09","experimentalVK":false,"fileSizes":{"game-be4ff09.pck":19183584,"game-be4ff09.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
      const threads = false;
      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');
      const detail = document.getElementById('loading-detail');
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');
      const buildLabel = document.getElementById('loading-build');
      document.getElementById('game-title').textContent = document.title;
      // 显示 build ID（即 executable 名称，如 game-ca1fb67），可用于快速核验缓存是否命中最新版本
      if (buildLabel && config.executable) {
        buildLabel.textContent = config.executable;
        // 将版本 ID 同步写入 document.documentElement.dataset.build，方便控制台查询
        document.documentElement.dataset.build = config.executable;
      }
      // Single-language holiday: pin Simplified Chinese on the loader.
      const zh = true;
      document.documentElement.lang = 'zh-CN';
      status.textContent = zh ? '正在加载…' : 'Loading…';
      retry.textContent = zh ? '重试' : 'Retry';
      progress.setAttribute('aria-label', zh ? '下载进度' : 'Download progress');
      retry.addEventListener('click', () => window.location.reload());
      let failed = false;
      let ready = false;
      let engineReady = false;
      let firstFrame = false;
      const timings = window.youjiaLoadTimings = {};
      const stamp = (name) => {
        if (timings[name] === undefined) timings[name] = Math.round(performance.now() - startedAt);
      };
      const mib = (bytes) => (bytes / 1048576).toFixed(1);
      const startedAt = performance.now();
      let lastProgressAt = startedAt;
      let downloadedBytes = 0;
      let downloadComplete = false;
      const finish = () => {
        if (failed || !engineReady || !firstFrame) return;
        ready = true;
        stopObserving();
        loading.hidden = true;
        if (config.focusCanvas) canvas.focus();
        console.info('[game-loading] timings_ms', JSON.stringify(timings));
      };
      const onFirstFrame = () => { firstFrame = true; stamp('firstFrame'); finish(); };
      window.addEventListener('youjia:first-frame', onFirstFrame, { once: true });
      const updateNotice = () => {
        if (failed || ready) return;
        const seconds = Math.floor((performance.now() - startedAt) / 1000);
        detail.textContent = downloadComplete
          ? `下载已完成 · 总计已用 ${seconds} 秒`
          : `已读取 ${mib(downloadedBytes)} MiB 资源数据（解压后）· ${seconds} 秒`;
        if (seconds < 30) return;
        notice.hidden = false;
        retry.hidden = false;
        const message = performance.now() - lastProgressAt >= 30000
          ? (zh ? '暂未看到新的加载进度。可以继续等待，或重试。' : 'No recent loading progress. You can keep waiting or retry.')
          : (zh ? '仍在加载。可以继续等待，或重试。' : 'Still loading. You can keep waiting or retry.');
        if (notice.textContent !== message) notice.textContent = message;
      };
      const onWindowError = (event) => fail(event.error || new Error('Engine startup error'));
      const onUnhandledRejection = (event) => fail(event.reason || new Error('Engine startup rejected'));
      // Time alone cannot prove failure: downloads and WASM compilation may be slow.
      const startupWatch = setInterval(updateNotice, 1000);
      const stopObserving = () => {
        clearInterval(startupWatch);
        window.removeEventListener('youjia:first-frame', onFirstFrame);
        window.removeEventListener('error', onWindowError);
        window.removeEventListener('unhandledrejection', onUnhandledRejection);
      };
      const fail = (error) => {
        if (failed || ready) return;
        failed = true;
        stopObserving();
        console.error('[game-loading] Startup failed', error);
        loading.hidden = false;
        const errMsg = String(error.message || error);
        // 分类错误信息：WebGL2 缺失 / 其他缺失浏览器特性 / 一般失败
        if (errMsg.includes('WebGL2')) {
          status.textContent = '此浏览器不支持 WebGL2，无法启动游戏。';
        } else if (errMsg.includes('Missing browser features')) {
          status.textContent = '浏览器缺少必要特性，无法启动游戏。';
        } else {
          status.textContent = '游戏加载失败，请重试。';
        }
        detail.textContent = errMsg.slice(0, 240);
        stamp('failed');
        progress.hidden = true;
        notice.hidden = true;
        retry.hidden = false;
      };
      // Some Godot bootstrap promises do not forward download/compile failures.
      window.addEventListener('error', onWindowError);
      window.addEventListener('unhandledrejection', onUnhandledRejection);
      const onProgress = (current, total) => {
        if (failed || ready) return;
        // Repeated/unknown totals do not renew liveness; growing byte counts do.
        if (Number.isFinite(current) && current > downloadedBytes) {
          downloadedBytes = current;
          lastProgressAt = performance.now();
        }
        if (!downloadComplete && Number.isFinite(total) && total > 0 && Number.isFinite(current) && current >= total) {
          downloadComplete = true;
          stamp('downloadComplete');
          lastProgressAt = performance.now();
        }
        updateNotice();
        if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(current) || current < 0) {
          progress.removeAttribute('value');
          status.textContent = zh ? '正在加载…' : 'Loading…';
          return;
        }
        progress.max = total;
        progress.value = Math.min(current, total);
        status.textContent = current >= total
          ? '下载完成，正在启动引擎…'
          : `下载资源 ${Math.floor(current / total * 100)}% · ${mib(current)} / ${mib(total)} MiB（解压后）`;
      };
      const start = async () => {
        if (failed) return;
        try {
          lastProgressAt = performance.now();
          stamp('engineScriptReady');
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          engineReady = true;
          stamp('engineReady');
          status.textContent = '引擎已启动，正在绘制画面…';
          finish();
        } catch (error) {
          fail(error);
        }
      };
      const script = document.createElement('script');
      script.src = 'game-be4ff09.js';
      script.addEventListener('load', start, { once: true });
      script.addEventListener('error', () => fail(new Error('Engine script could not be loaded')), { once: true });
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
