name: Verify pull request

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: verify-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The default PR checkout validates the proposed merge with main.
      - name: Check out proposed merge without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/docs/
          sparse-checkout-cone-mode: false

      - name: Install Godot 4.7.2 and Web export templates
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/template-files"
          curl -fsSL https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          curl -fsSL https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q "$RUNNER_TEMP/templates.tpz" 'templates/web*' -d "$RUNNER_TEMP/template-files"
          cp "$RUNNER_TEMP/template-files/templates/"web* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"

      - name: Verify web bundle retention
        run: python3 test/web_bundle_retention_test.py

      - name: Verify versioned persistence module publication
        run: python3 test/publish_storage_modules_test.py

      - name: Run game verification
        timeout-minutes: 30
        run: GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" bash tools/verify_daily_life.sh

      - name: Prepare Web export directory
        run: mkdir -p dist

      - name: Export Web build without publishing
        timeout-minutes: 5
        run: |
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --export-release Web dist/index.html
          for output in dist/index.html dist/index.js dist/index.wasm dist/index.pck; do
            test -s "$output"
          done
