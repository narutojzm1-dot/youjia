name: assemble-main-once
on:
  push:
    branches:
      - work/grok-contributor/hold-hotbar-place-intent
    paths:
      - tools/main_hold_hotbar.mount.patch
      - tools/apply_hold_main_mount.sh
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply HoldHotbar Main mount patch
        run: bash tools/apply_hold_main_mount.sh
      - name: Commit restored main.gd and remove one-shot scaffolding
        run: |
          git config user.name "narutojzm1-dot"
          git config user.email "narutojzm1@gmail.com"
          rm -f tools/main_hold_hotbar.mount.patch tools/apply_hold_main_mount.sh
          rm -f .github/workflows/assemble-main-once.yml
          rm -rf tools/_main_parts
          git add scripts/main.gd
          git add -u
          git status
          git commit -m "REQ-20261008-075: restore Main.gd HoldHotbar end-to-end mount" || echo "nothing to commit"
          git push origin "HEAD:${{ github.ref_name }}"
