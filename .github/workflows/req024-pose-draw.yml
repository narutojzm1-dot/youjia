name: req024-pose-draw
on:
  push:
    branches:
      - work/grok-contributor/REQ-20261003-024-still-boundary-feedback-v2
    paths:
      - .github/workflows/req024-pose-draw.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore yard_world from a08d817 and call BoundaryFeedback.pose
        run: |
          git fetch --depth=1 origin a08d8173cc13b17779b251e7653d834837326ea7
          git checkout a08d8173cc13b17779b251e7653d834837326ea7 -- scripts/game/yard_world.gd
          python3 - << 'PY'
          from pathlib import Path
          p = Path("scripts/game/yard_world.gd")
          text = p.read_text()
          old = "func _draw() -> void:\n\tif _rejected_seconds > 0.0:\n\t\tvar alpha := minf(1.0, _rejected_seconds / 0.35) * 0.80\n\t\tvar ink := Color(0.52,0.31,0.20,alpha)\n"
          new = "func _draw() -> void:\n\tif _rejected_seconds > 0.0:\n\t\tvar reduced_motion := bool(TuningStore.get_value(\"ui.reduced_motion\", false))\n\t\tvar alpha := float(BoundaryFeedback.pose(_rejected_seconds, reduced_motion).alpha)\n\t\tvar ink := Color(0.52,0.31,0.20,alpha)\n"
          if old not in text:
              raise SystemExit("pattern missing after restore; size=%s" % p.stat().st_size)
          text = text.replace(old, new, 1)
          if text.count("BoundaryFeedback.pose(_rejected_seconds, reduced_motion)") != 1:
              raise SystemExit("pose count")
          if "_rejected_seconds / 0.35" in text:
              raise SystemExit("old fade remains")
          if "Time.get_ticks_msec" in text:
              raise SystemExit("wall clock")
          p.write_text(text)
          if p.stat().st_size != 71577:
              raise SystemExit("size %s" % p.stat().st_size)
          print("patched", p.stat().st_size)
          wf = Path(".github/workflows/req024-pose-draw.yml")
          if wf.exists():
              wf.unlink()
          PY
          git config user.name "narutojzm1-dot"
          git config user.email "narutojzm1@gmail.com"
          git add -A
          git commit -m "$(cat <<'EOF'
          REQ-20261003-024: boundary arc draw calls BoundaryFeedback.pose

          Restore yard_world.gd after the truncated placeholder commit, then let reduced motion control boundary-arc alpha only. Remaining time stays owned by YardWorld.tick. Radius stays 12. Removes the one-shot patch workflow.

          Agent-ID: GROK-CONTRIBUTOR
          EOF
          )"
          git push origin HEAD:work/grok-contributor/REQ-20261003-024-still-boundary-feedback-v2
