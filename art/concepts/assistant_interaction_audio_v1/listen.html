<!doctype html><html lang="zh"><meta charset="utf-8"><title>动物动作短音候选</title><h1>短动作声 · 未听验候选</h1><p>手动试听，无生产接线。重复试听每次间隔1秒；切后台或停止会取消。</p><h2>轻抚 0.46秒</h2><audio controls preload="auto" src="pet_soft.wav"></audio><button data-cue="0">重复六次</button><h2>递食 0.34秒</h2><audio controls preload="auto" src="feed_rustle.wav"></audio><button data-cue="1">重复六次</button><p><button id="stop">停止</button><output id="state">未播放</output></p><script>
let timers=[],played=0;const audio=[...document.querySelectorAll('audio')];function stop(){timers.forEach(clearTimeout);timers=[];audio.forEach(a=>{a.pause();a.currentTime=0});document.querySelector('#state').value='已停止'}document.querySelector('#stop').onclick=stop;document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});document.querySelectorAll('[data-cue]').forEach(b=>b.onclick=()=>{stop();played=0;const a=audio[Number(b.dataset.cue)];for(let i=0;i<6;i++)timers.push(setTimeout(()=>{a.currentTime=0;a.play().then(()=>document.querySelector('#state').value='重复 '+(++played)+'/6').catch(e=>document.querySelector('#state').value='播放失败：'+e.message)},i*1000))});
</script></html>
