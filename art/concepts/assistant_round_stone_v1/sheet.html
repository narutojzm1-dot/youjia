<!doctype html><html lang="zh"><meta charset="utf-8"><title>圆石实际尺度方向材料</title><style>body{font:16px system-ui;background:#f5eee0;color:#453b32}canvas{width:100%;max-width:1280px}article{margin:30px 0}</style><h1>圆石候选 · 静态合成方向材料</h1><p>已有院景中的三个草地取样位置；不代表碰撞安全或正式自由度。正常倍率、同视角，无镜头放大。提篮仅文字流程建议，不是已实现UI/保存。</p><div id="boards"></div><p>提篮短序列建议：路边选择圆石 → 同一篮中可见 → 回院仍在篮中 → 选圆石预览 → 取消仍在篮／确认摆下／收起回同一篮。容量、造型、位置、自由度待决定；不复制物品、不加奖励结算。</p><script type="module">
const load=async p=>{let i=new Image;i.src=p;await i.decode();return i};
const [bg,person,stone]=await Promise.all([load('../../../assets/holiday/environment/yard_sunny.png'),load('../../../assets/holiday/characters/resident_walk_authored_v1/idle.png'),load('round_stone.png')]);
for(const [label,x,y]of [['靠近花圃的草地',490,450],['院中草地',480,500],['靠近散步位置的草地',440,545]])for(const state of ['未摆','摆后','收起']){let a=document.createElement('article'),h=document.createElement('h2'),c=document.createElement('canvas');h.textContent=label+' · '+state;c.width=1280;c.height=720;let t=c.getContext('2d');t.drawImage(bg,0,0,1280,720);let s=Math.max(.65,Math.min(1.2,.8+(y-450)*.0021));if(state==='摆后')t.drawImage(stone,x-48*s,y-48*s,96*s,64*s);t.drawImage(person,315,450,100,100);t.fillStyle='#fff8e6';t.fillRect(15,15,840,50);t.fillStyle='#453b32';t.font='18px sans-serif';t.fillText('静态合成 / 非游戏照片：'+label+' / '+state+' / 足点假设 '+x+','+y+' / 素材画布宽 '+(96*s).toFixed(1)+'px',25,46);a.append(h,c);document.querySelector('#boards').append(a)}window.sheetReady=true;
</script></html>
